# The name displayed in the GitHub Actions tab.
name: Hello World with Python

# Events that start this workflow.
on:
  # Run automatically when code is pushed to main.
  push:
    branches:
      - main
  # Allow the workflow to be started manually.
  workflow_dispatch:

# Defines the jobs that run when the workflow is triggered.
jobs:
  hello-python:
    name: Run the Python Hello World program
    # Specifies the virtual machine runner environment.
    runs-on: ubuntu-latest
    
    steps:
      # Checks out your repository code onto the runner.
      - name: Check out the repository
        uses: actions/checkout@v4

# Sets up the Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      # Runs the Python script and passes the environment variable.
      - name: Run the Python program
        env:
          WHO_TO_GREET: 'GitHub Actions Student'
        run: python hello.py
